<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Examination | ExamPro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="exam-header">

        <div class="exam-logo">
            <span>EXAM</span>PRO
        </div>

        <div class="exam-title">
            <h2>Computer Based Test</h2>
            <p>Online Examination</p>
        </div>

        <div class="timer-box">
            <span>Time Remaining</span>
            <strong id="timer">30:00</strong>
        </div>

    </header>

    <main class="exam-container">
                <div class="exam-top">

            <div>
                <span>Student</span>
                <strong id="studentDisplay">Student</strong>
            </div>

            <div>
                <span>Question</span>
                <strong>
                    <span id="currentQuestion">1</span>
                    /
                    <span id="totalQuestions">5</span>
                </strong>
            </div>

        </div>


        <section class="question-card">

            <div class="question-number">
                Question 1
            </div>

            <h1 id="questionText">
                What is the value of 2 + 2?
            </h1>


            <div class="options">

                <label class="option">
                    <input type="radio" name="answer" value="A">
                    <span class="option-letter">A</span>
                    <span>3</span>
                </label>


                <label class="option">
                    <input type="radio" name="answer" value="B">
                    <span class="option-letter">B</span>
                    <span>4</span>
                </label>


                <label class="option">
                    <input type="radio" name="answer" value="C">
                    <span class="option-letter">C</span>
                    <span>5</span>
                </label>


                <label class="option">
                    <input type="radio" name="answer" value="D">
                    <span class="option-letter">D</span>
                    <span>6</span>
                </label>

            </div>

        </section>


        <div class="exam-navigation">

            <button id="previousBtn" class="nav-btn secondary">
                ← Previous
            </button>

            <button id="nextBtn" class="nav-btn">
                Next →
            </button>

        </div>
        <div class="question-navigation">

            <h3>Questions</h3>

            <div class="question-numbers">

                <button class="question-number active">1</button>
                <button class="question-number">2</button>
                <button class="question-number">3</button>
                <button class="question-number">4</button>
                <button class="question-number">5</button>

            </div>

        </div>


        <div class="submit-area">

            <button id="submitExam" class="submit-exam">
                Submit Examination
            </button>

        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
